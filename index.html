<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>掌鑑 — てのひらかがみ | 手相占い</title>
    <meta name="description" content="手のひらを撮って四大線をなぞるだけ。生命線・頭脳線・感情線・運命線から性格・仕事・恋愛・健康を読み解く手相占い。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤲</text></svg>" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="brand">掌鑑<span>てのひらかがみ</span></h1>
        <button id="btn-open-history" class="ghost small" type="button">履歴</button>
      </header>

      <!-- 1. 撮影 -->
      <section class="screen" id="screen-capture" data-active="true">
        <ol class="steps">
          <li class="on">撮る</li><li>合わせる</li><li>なぞる</li><li>読む</li>
        </ol>

        <div class="field">
          <span class="field-label">どちらの手を観ますか</span>
          <div class="segmented" id="hand-select">
            <button type="button" data-hand="right" class="on">右手<small>いまの自分</small></button>
            <button type="button" data-hand="left">左手<small>生まれ持った素質</small></button>
          </div>
        </div>

        <div class="camera-box">
          <video id="video" playsinline muted></video>
          <div class="camera-guide" aria-hidden="true"></div>
          <p class="camera-hint" id="camera-hint">手のひら全体が枠に収まるように、明るい場所で。</p>
        </div>

        <div class="actions">
          <button id="btn-camera" class="primary" type="button">カメラを起動</button>
          <button id="btn-shutter" class="primary" type="button" hidden>撮影する</button>
          <label class="ghost file-label">
            写真を選ぶ
            <input id="file" type="file" accept="image/*" hidden />
          </label>
          <button id="btn-sample" class="ghost" type="button">サンプルで試す</button>
        </div>
        <p class="note" id="capture-error" hidden></p>
      </section>

      <!-- 2/3. 基準合わせ・なぞり（キャンバス共有） -->
      <section class="screen" id="screen-edit">
        <ol class="steps">
          <li class="done">撮る</li><li id="step-anchor">合わせる</li><li id="step-trace">なぞる</li><li>読む</li>
        </ol>

        <h2 class="edit-title" id="edit-title">手の基準点を合わせます</h2>
        <p class="edit-hint" id="edit-hint">検出中…</p>

        <div class="stage-wrap">
          <canvas id="stage"></canvas>
        </div>

        <div class="controls" id="anchor-controls">
          <button id="btn-anchor-manual" class="ghost" type="button">自分で指定する</button>
          <button id="btn-anchor-next" class="primary" type="button" disabled>この位置でOK</button>
        </div>

        <div class="controls" id="trace-controls" hidden>
          <div class="line-chips" id="line-chips"></div>
          <label class="toggle"><input type="checkbox" id="guide-toggle" checked /> なぞる場所のお手本を出す</label>
          <div class="row">
            <button id="btn-undo" class="ghost" type="button">1本消す</button>
            <button id="btn-skip" class="ghost" type="button">見当たらない</button>
            <button id="btn-next-line" class="primary" type="button">次へ</button>
          </div>
        </div>

        <button id="btn-back-capture" class="link" type="button">撮り直す</button>
      </section>

      <!-- 4. 結果 -->
      <section class="screen" id="screen-result">
        <div id="result"></div>
        <div class="actions">
          <button id="btn-save-card" class="primary" type="button">結果を画像で保存</button>
          <button id="btn-restart" class="ghost" type="button">もう一度観る</button>
        </div>
        <p class="disclaimer">
          手相占いはエンタメです。健康や進路の判断は、専門家にご相談ください。
        </p>
      </section>

      <!-- 履歴 -->
      <section class="screen" id="screen-history">
        <h2 class="edit-title">これまでの鑑定</h2>
        <div id="history-list" class="history-list"></div>
        <div class="actions">
          <button id="btn-history-clear" class="ghost" type="button">すべて消す</button>
          <button id="btn-history-back" class="primary" type="button">戻る</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
